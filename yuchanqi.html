<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>孕期全程管理 · 预产期计算</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#2d3a4a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
        /* ============================================================
           全局重置 & 变量
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #f5f7fa;
            --card-bg: rgba(255, 255, 255, 0.88);
            --card-border: rgba(255, 255, 255, 0.5);
            --shadow: 0 20px 60px rgba(0, 20, 30, 0.08), 0 8px 24px rgba(0, 0, 0, 0.04);
            --text-primary: #1a2634;
            --text-secondary: #4a5a6e;
            --text-muted: #8a9aa8;
            --accent: #2d3a4a;
            --accent-light: #f0f5fe;
            --border-color: #dce3ec;
            --radius: 28px;
            --radius-sm: 18px;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --transition: 0.25s ease;
            --progress-bg: #e9edf2;
            --progress-fill: #4a7a9a;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #181e26;
                --card-bg: rgba(30, 36, 44, 0.92);
                --card-border: rgba(255, 255, 255, 0.06);
                --shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
                --text-primary: #eef2f6;
                --text-secondary: #b0c0ce;
                --text-muted: #7a8a9a;
                --accent: #4a5f74;
                --accent-light: #1e2f42;
                --border-color: #3a4856;
                --progress-bg: #2d3a48;
                --progress-fill: #5a8aaa;
            }
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            min-height: 100vh;
            padding: 12px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            background: linear-gradient(145deg, #f0f4f8 0%, #e2e8f0 100%);
        }
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(145deg, #181e26 0%, #0f141a 100%);
            }
        }

        .app-wrapper {
            max-width: 100%;
            width: 100%;
            padding: 4px 12px 20px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        /* 卡片通用 */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: var(--radius);
            padding: 24px 28px 28px;
            box-shadow: var(--shadow);
            border: 1px solid var(--card-border);
            transition: background var(--transition);
        }

        /* ===== 顶部卡片 ===== */
        .top-card .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 6px;
        }
        .top-card .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .icon-heart {
            width: 44px;
            height: 44px;
            background: #fde8e8;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #e25c5c;
            box-shadow: 0 4px 10px rgba(226, 92, 92, 0.12);
            flex-shrink: 0;
        }
        @media (prefers-color-scheme: dark) {
            .icon-heart {
                background: #3a2a2a;
                color: #e07070;
            }
        }
        .title {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .title small {
            font-size: 15px;
            font-weight: 400;
            color: var(--text-muted);
            margin-left: 8px;
        }
        .badge {
            background: #eef2f6;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.3);
            white-space: nowrap;
        }
        @media (prefers-color-scheme: dark) {
            .badge {
                background: #2d3a48;
                color: #b0c0ce;
                border-color: rgba(255, 255, 255, 0.05);
            }
        }
        .subhead {
            font-size: 14px;
            color: var(--text-muted);
            margin: 8px 0 20px 0;
            padding-left: 14px;
            border-left: 3px solid var(--border-color);
            line-height: 1.6;
        }

        /* 计算器输入行 */
        .calc-row {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 12px 16px;
        }
        .calc-row .field {
            flex: 2 1 220px;
            min-width: 160px;
        }
        .calc-row .field label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }
        .calc-row .field label .required {
            color: #e25c5c;
        }
        .input-wrapper {
            display: flex;
            align-items: center;
            background: #ffffff;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--border-color);
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        @media (prefers-color-scheme: dark) {
            .input-wrapper {
                background: #252d36;
                border-color: #3a4856;
            }
        }
        .input-wrapper:focus-within {
            border-color: #b4c8e0;
            box-shadow: 0 4px 14px rgba(60, 100, 150, 0.08);
        }
        .input-wrapper .icon-input {
            padding: 0 0 0 14px;
            font-size: 16px;
            opacity: 0.5;
            user-select: none;
        }
        .input-wrapper input {
            width: 100%;
            padding: 13px 14px 13px 8px;
            border: none;
            background: transparent;
            font-size: 15px;
            color: var(--text-primary);
            outline: none;
            min-height: 48px;
        }
        input[type="date"] {
            appearance: none;
            -webkit-appearance: none;
            color: var(--text-primary);
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            opacity: 0.4;
            padding: 4px;
            cursor: pointer;
        }
        .btn-primary {
            padding: 13px 32px;
            background: var(--accent);
            border: none;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: 0 6px 18px rgba(45, 58, 74, 0.12);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .btn-primary:active {
            transform: scale(0.97);
            background: #1f2a36;
        }
        @media (prefers-color-scheme: dark) {
            .btn-primary {
                background: #4a5f74;
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
            }
            .btn-primary:active {
                background: #3a4e62;
            }
        }
        .btn-sm {
            padding: 6px 16px;
            font-size: 13px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
        }
        .btn-sm:hover {
            background: var(--accent-light);
        }
        .btn-sm.primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .btn-sm.primary:hover {
            opacity: 0.85;
        }

        /* 快捷按钮 */
        .quick-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        /* 多胎 & 提醒 */
        .row-flex {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 24px;
            margin-top: 14px;
            align-items: center;
        }
        .row-flex .item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .row-flex .item select,
        .row-flex .item input[type="number"] {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }
        .row-flex .item input[type="number"] {
            width: 70px;
        }
        @media (prefers-color-scheme: dark) {
            .row-flex .item select,
            .row-flex .item input[type="number"] {
                background: #252d36;
                border-color: #3a4856;
                color: #eef2f6;
            }
        }

        /* 进度条 */
        .progress-wrap {
            margin-top: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .progress-track {
            flex: 1;
            height: 8px;
            background: var(--progress-bg);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #7ab0d0, var(--progress-fill));
            border-radius: 20px;
            transition: width 0.4s ease;
        }
        .progress-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
            min-width: 60px;
            text-align: right;
        }

        /* 摘要 */
        .calc-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 30px;
            margin-top: 16px;
            padding: 14px 18px;
            background: var(--accent-light);
            border-radius: var(--radius-sm);
            border: 1px solid rgba(180, 200, 224, 0.2);
        }
        .calc-summary.hidden {
            display: none;
        }
        .calc-summary .item {
            display: flex;
            align-items: baseline;
            gap: 6px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .calc-summary .item .val {
            font-weight: 700;
            font-size: 17px;
            color: var(--text-primary);
        }
        .calc-summary .item .val.highlight {
            color: #e25c5c;
        }
        @media (prefers-color-scheme: dark) {
            .calc-summary {
                background: #1e2f42;
                border-color: #3a5a78;
            }
            .calc-summary .item .val {
                color: #eef2f6;
            }
        }

        /* 倒计时 & 胎儿 */
        .extra-track {
            margin-top: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: stretch;
        }
        .extra-track .countdown-box {
            flex: 1 1 180px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .extra-track .countdown-box .label {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
        .extra-track .countdown-box .number {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
        }
        .extra-track .countdown-box .number small {
            font-size: 16px;
            font-weight: 400;
            color: var(--text-muted);
            margin-left: 4px;
        }
        .extra-track .fetus-box {
            flex: 2 1 280px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .extra-track .fetus-box .label {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
        .extra-track .fetus-box .desc {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-top: 2px;
        }
        @media (prefers-color-scheme: dark) {
            .extra-track .countdown-box,
            .extra-track .fetus-box {
                background: rgba(255, 255, 255, 0.05);
                border-color: #3a4856;
            }
        }
        @media (max-width: 480px) {
            .extra-track .countdown-box .number {
                font-size: 22px;
            }
            .extra-track .fetus-box .desc {
                font-size: 13px;
            }
        }

        /* ===== 下方左右两栏 ===== */
        .bottom-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        /* 左侧：健康追踪 */
        .left-card .section-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .left-card .section-title span {
            font-size: 18px;
        }

        /* 健康网格 */
        .health-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 16px;
        }
        .health-grid .block {
            background: rgba(255, 255, 255, 0.4);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            border: 1px solid var(--border-color);
            min-width: 0;
        }
        .health-grid .block .h-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .health-grid .block .h-input-group {
            display: flex;
            gap: 8px;
            flex-wrap: nowrap;
            align-items: center;
        }
        .health-grid .block .h-input-group input {
            flex: 1 1 auto;
            min-width: 80px;
            padding: 7px 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
        }
        .health-grid .block .h-input-group input:focus {
            border-color: #b4c8e0;
        }
        .health-grid .block .h-input-group .btn-sm {
            flex-shrink: 0;
        }
        .health-grid .block .h-list {
            margin-top: 8px;
            max-height: 100px;
            overflow-y: auto;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .health-grid .block .h-list div {
            padding: 4px 0;
            border-bottom: 1px dashed var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .health-grid .block .h-list div:last-child {
            border-bottom: none;
        }
        .health-grid .block .h-list .text-muted {
            font-size: 12px;
        }
        @media (prefers-color-scheme: dark) {
            .health-grid .block {
                background: rgba(255, 255, 255, 0.04);
                border-color: rgba(255, 255, 255, 0.06);
            }
            .health-grid .block .h-list div {
                border-bottom-color: rgba(255, 255, 255, 0.06);
            }
        }

        /* 医院信息 */
        .hospital-section {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }
        .hospital-section input {
            padding: 7px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-primary);
            font-size: 13px;
            flex: 1 1 120px;
            min-width: 90px;
            outline: none;
        }
        .hospital-section input:focus {
            border-color: #b4c8e0;
        }
        .hospital-section .btn-sm {
            flex-shrink: 0;
        }
        @media (prefers-color-scheme: dark) {
            .hospital-section {
                background: rgba(255, 255, 255, 0.04);
                border-color: rgba(255, 255, 255, 0.06);
            }
            .hospital-section input {
                background: #252d36;
                border-color: #3a4856;
                color: #eef2f6;
            }
        }

        .action-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: flex-start;
        }

        /* ===== 右侧：孕期指南 ===== */
        .guide-card .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .guide-card .section-title .stage-label {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-muted);
            margin-left: auto;
        }

        .stage-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .stage-tabs .stage-btn {
            padding: 10px 22px;
            border: 2px solid var(--border-color);
            border-radius: 40px;
            background: transparent;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1 0 auto;
            justify-content: center;
            min-width: 80px;
        }
        .stage-tabs .stage-btn:hover {
            border-color: #b4c8e0;
            background: rgba(180, 200, 224, 0.08);
        }
        .stage-tabs .stage-btn.active {
            border-color: var(--accent);
            background: var(--accent-light);
            color: var(--text-primary);
            box-shadow: 0 2px 8px rgba(45, 58, 74, 0.06);
        }
        .stage-tabs .stage-btn .emoji {
            font-size: 18px;
        }
        .stage-tabs .stage-btn .weeks {
            font-size: 11px;
            font-weight: 400;
            color: var(--text-muted);
            margin-left: 2px;
        }
        @media (prefers-color-scheme: dark) {
            .stage-tabs .stage-btn {
                border-color: #3a4856;
                color: #b0c0ce;
            }
            .stage-tabs .stage-btn.active {
                border-color: #5a7a9a;
                background: #1e2f42;
                color: #eef2f6;
            }
            .stage-tabs .stage-btn .weeks {
                color: #7a8a9a;
            }
        }

        .content-tabs {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 18px;
            border-bottom: 1.5px solid var(--border-color);
            padding-bottom: 2px;
        }
        .content-tabs .tab-btn {
            padding: 8px 14px;
            border: none;
            background: transparent;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: all var(--transition);
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            border-radius: 0;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .content-tabs .tab-btn:hover {
            color: var(--text-secondary);
        }
        .content-tabs .tab-btn.active {
            color: var(--text-primary);
            border-bottom-color: var(--accent);
            font-weight: 600;
        }
        .content-tabs .tab-btn .icon {
            font-size: 14px;
        }
        @media (prefers-color-scheme: dark) {
            .content-tabs {
                border-bottom-color: #3a4856;
            }
            .content-tabs .tab-btn {
                color: #7a8a9a;
            }
            .content-tabs .tab-btn.active {
                color: #eef2f6;
                border-bottom-color: #5a7a9a;
            }
        }
        @media (max-width: 480px) {
            .content-tabs .tab-btn {
                padding: 6px 10px;
                font-size: 12px;
            }
            .content-tabs .tab-btn .icon {
                font-size: 12px;
            }
        }

        .tab-panels .panel {
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .tab-panels .panel.active {
            display: block;
        }
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .panel h4 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel ul {
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .panel ul li {
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            border: 1px solid rgba(220, 227, 236, 0.2);
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-secondary);
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .panel ul li .li-icon {
            font-size: 16px;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .panel ul li strong {
            color: var(--text-primary);
        }
        .panel ul li .del-btn {
            margin-left: auto;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
        }
        .panel ul li .del-btn:hover {
            color: #e25c5c;
        }
        @media (prefers-color-scheme: dark) {
            .panel ul li {
                background: rgba(255, 255, 255, 0.04);
                border-color: rgba(255, 255, 255, 0.06);
            }
            .panel ul li strong {
                color: #eef2f6;
            }
        }
        .panel .info-card {
            padding: 14px 18px;
            background: var(--accent-light);
            border-radius: 14px;
            border-left: 4px solid var(--accent);
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-secondary);
        }
        .panel .info-card strong {
            color: var(--text-primary);
        }

<body>

    <div class="app-wrapper">
        <!-- ============================================================
        顶部卡片：预产期计算器
        ============================================================ -->
        <div class="card top-card">
            <div class="header">
                <div class="header-left">
                    <div class="icon-heart" aria-hidden="true">🤰</div>
                    <h1 class="title">预产期 <small>计算器</small></h1>
                </div>
                <span class="badge">全程管理</span>
            </div>
            <p class="subhead">根据末次月经日期推算预产期与当前孕周，所有数据自动保存在本地</p>

            <form id="dueDateForm" novalidate>
                <div class="calc-row">
                    <div class="field">
                        <label for="lastPeriod">末次月经第一天 <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <span class="icon-input" aria-hidden="true">📅</span>
                            <input type="date" id="lastPeriod" name="lastPeriod" required />
                        </div>
                    </div>
                    <button type="submit" class="btn-primary" id="calcBtn">计算 <span aria-hidden="true">→</span></button>
                </div>
            </form>

            <!-- 快捷日期 -->
            <div class="quick-btns">
                <button class="btn-sm" data-quick="today">📅 今天</button>
                <button class="btn-sm" data-quick="280">📆 末次（-280天）</button>
                <button class="btn-sm" data-quick="270">📆 末次（-270天）</button>
            </div>

            <!-- 多胎 & 提醒 -->
            <div class="row-flex">
                <div class="item">
                    <label>👶 多胎：</label>
                    <select id="multiples">
                        <option value="1">单胎</option>
                        <option value="2">双胎</option>
                        <option value="3">三胎</option>
                    </select>
                </div>
                <div class="item">
                    <label>⏰ 提前提醒（天）：</label>
                    <input type="number" id="remindDays" value="7" min="0" max="30" />
                    <span style="font-size:12px;color:var(--text-muted);">倒计时将减去此天数</span>
                </div>
            </div>

            <!-- 进度条 -->
            <div class="progress-wrap">
                <span class="progress-label" id="progressLabel">0%</span>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill" style="width:0%;"></div>
                </div>
            </div>

            <!-- 计算摘要 -->
            <div class="calc-summary hidden" id="calcSummary">
                <div class="item">🤱 预产期 <span class="val highlight" id="dueDateDisplay">--</span></div>
                <div class="item">📆 当前孕周 <span class="val" id="weeksDisplay">--</span></div>
                <div class="item">📅 已怀孕 <span class="val" id="daysDisplay">-- 天</span></div>
                <div class="item">🧬 <span id="trimesterDisplay" class="val">--</span></div>
            </div>

            <!-- 倒计时 & 胎儿发育 -->
            <div class="extra-track hidden" id="extraTrack">
                <div class="countdown-box">
                    <div class="label">⏳ 距离预产期（含提醒）</div>
                    <div class="number" id="countdownNumber">-- <small>天</small></div>
                </div>
                <div class="fetus-box">
                    <div class="label">👶 胎儿发育参考</div>
                    <div class="desc" id="fetusBrief">--</div>
                </div>
            </div>
        </div>

        <!-- ============================================================
        下方左右两栏
        ============================================================ -->
        <div class="bottom-grid">
            <!-- 左侧：健康追踪 + 医院信息 + 导入导出 -->
            <div class="card left-card">
                <div class="section-title"><span>📊</span> 健康与记录</div>

                <!-- 健康网格 -->
                <div class="health-grid">
                    <div class="block">
                        <div class="h-title">⚖️ 体重 (kg)</div>
                        <div class="h-input-group">
                            <input type="number" id="weightInput" step="0.1" placeholder="输入体重" />
                            <button class="btn-sm primary" id="weightAdd">记录</button>
                        </div>
                        <div class="h-list" id="weightList"></div>
                    </div>
                    <div class="block">
                        <div class="h-title">💉 血压 (mmHg)</div>
                        <div class="h-input-group">
                            <input type="text" id="bpInput" placeholder="例如：120/80" />
                            <button class="btn-sm primary" id="bpAdd">记录</button>
                        </div>
                        <div class="h-list" id="bpList"></div>
                    </div>
                    <div class="block">
                        <div class="h-title">👣 胎动次数</div>
                        <div class="h-input-group">
                            <input type="number" id="kickInput" placeholder="输入次数" />
                            <button class="btn-sm primary" id="kickAdd">记录</button>
                        </div>
                        <div class="h-list" id="kickList"></div>
                    </div>
                    <div class="block">
                        <div class="h-title">📊 宫缩频率</div>
                        <div class="h-input-group">
                            <input type="text" id="contractionInput" placeholder="例如：10分钟1次" />
                            <button class="btn-sm primary" id="contractionAdd">记录</button>
                        </div>
                        <div class="h-list" id="contractionList"></div>
                    </div>
                </div>

                <!-- 医院信息 -->
                <div class="section-title" style="margin-top:8px;"><span>🏥</span> 医院 &amp; 医生</div>
                <div class="hospital-section">
                    <input type="text" id="hospitalName" placeholder="医院名称" />
                    <input type="text" id="doctorName" placeholder="主治医生" />
                    <input type="text" id="doctorPhone" placeholder="联系电话" />
                    <button class="btn-sm primary" id="hospitalSave">保存</button>
                </div>

                <!-- 数据操作 -->
                <div class="action-bar">
                    <button class="btn-sm" id="exportData">📤 导出全部数据</button>
                    <button class="btn-sm" id="importData">📥 导入数据</button>
                    <input type="file" id="fileInput" accept=".json" style="display:none;" />
                </div>
                <div style="font-size:12px;color:var(--text-muted);margin-top:6px;">
                    💾 所有数据自动保存在浏览器本地
                </div>
            </div>

            <!-- 右侧：孕期指南 -->
            <div class="card guide-card">
                <div class="section-title">
                    <span>📋</span> 孕期全程指南
                    <span class="stage-label" id="currentStageLabel">孕早期</span>
                </div>

                <!-- 阶段切换 -->
                <div class="stage-tabs" id="stageTabs">
                    <button class="stage-btn active" data-stage="early">
                        <span class="emoji">🌱</span> 孕早期 <span class="weeks">0–12周</span>
                    </button>
                    <button class="stage-btn" data-stage="mid">
                        <span class="emoji">🌿</span> 孕中期 <span class="weeks">13–27周</span>
                    </button>
                    <button class="stage-btn" data-stage="late">
                        <span class="emoji">🌾</span> 孕晚期 <span class="weeks">28–40周</span>
                    </button>
                </div>

                <!-- 内容标签 -->
                <div class="content-tabs" id="contentTabs">
                    <button class="tab-btn active" data-tab="checks"><span class="icon">🩺</span> 检查</button>
                    <button class="tab-btn" data-tab="notes"><span class="icon">💡</span> 注意</button>
                    <button class="tab-btn" data-tab="diet"><span class="icon">🥗</span> 饮食</button>
                    <button class="tab-btn" data-tab="social"><span class="icon">📋</span> 社保</button>
                    <button class="tab-btn" data-tab="fetus"><span class="icon">👶</span> 胎儿</button>
                    <button class="tab-btn" data-tab="plan"><span class="icon">📅</span> 计划</button>
                    <button class="tab-btn" data-tab="birth"><span class="icon">🏥</span> 分娩</button>
                    <button class="tab-btn" data-tab="postnatal"><span class="icon">👩‍🍼</span> 产后</button>
                    <button class="tab-btn" data-tab="newborn"><span class="icon">📄</span> 新生儿</button>
                    <button class="tab-btn" data-tab="breastfeeding"><span class="icon">🤱</span> 哺乳</button>
                    <button class="tab-btn" data-tab="dad"><span class="icon">👨‍👧</span> 准爸爸</button>
                    <button class="tab-btn" data-tab="safety"><span class="icon">💊</span> 安全</button>
                </div>

                <!-- 面板 -->
                <div class="tab-panels" id="tabPanels"></div>

                <div class="footer">
                    <span>🌱 仅供参考 · 具体请遵医嘱 · 各地区政策可能不同</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  数据定义
        // ================================================================
        const STAGE_KEYS = ['early', 'mid', 'late'];
        const PREGNANCY_DATA = {
            early: {
                id: 'early',
                label: '孕早期',
                emoji: '🌱',

        function getStorage(key, def) {
            try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch { return def; }
        }

            localStorage.setItem(key, JSON.stringify(val));

        // ================================================================
        //  核心计算
        // ================================================================
        function daysBetween(d1, d2) {
            const t1 = new Date(d1.getFullYear(), d1.getMonth(), d1.getDate());
            const t2 = new Date(d2.getFullYear(), d2.getMonth(), d2.getDate());
            return Math.round((t2 - t1) / 86400000);
        }

        function getStageKey(weeks) {
            if (weeks <= 12) return 'early';
            if (weeks <= 27) return 'mid';
            return 'late';
        }

        function calculatePregnancy(lmpDate, multiples = 1) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const lmp = new Date(lmpDate.getFullYear(), lmpDate.getMonth(), lmpDate.getDate());
            lmp.setHours(0, 0, 0, 0);
            let adjust = 0;
            if (multiples === 2) adjust = -14;
            else if (multiples === 3) adjust = -28;
            const dueDate = new Date(lmp);
            dueDate.setDate(dueDate.getDate() + 280 + adjust);
            let daysPregnant = daysBetween(lmp, today);
            if (daysPregnant < 0) daysPregnant = 0;
            const weeks = Math.floor(daysPregnant / 7);
            const remDays = daysPregnant % 7;
            let trimester = '--';
            if (weeks <= 13) trimester = '第一孕期';
            else if (weeks <= 27) trimester = '第二孕期';
            else if (weeks <= 40) trimester = '第三孕期';
            else trimester = '已过预产期';
            if (daysPregnant === 0 && today < lmp) trimester = '尚未怀孕';
            const stageKey = getStageKey(weeks);
            let daysToDue = daysBetween(today, dueDate);
            if (daysToDue < 0) daysToDue = 0;
            return { dueDate, daysPregnant, weeks, remDays, trimester, stageKey, lmp, isFuture: today < lmp, daysToDue };
        }

        function getFetusDesc(weeks) {
            const map = {};
            STAGE_KEYS.forEach(k => {
                (PREGNANCY_DATA[k].fetus || []).forEach(f => { map[f.week] = f.desc; });
            });
            const keys = Object.keys(map).map(Number).sort((a, b) => a - b);
            let target = keys[0];
            for (let w of keys) { if (w <= weeks) target = w; else break; }
            return map[target] || '宝宝正在健康成长中 💕';
        }

                        <span class="plan-week">孕${p.week}周</span>
                        <span class="plan-content">${p.content}</span>
                        <span class="plan-status ${status}">${label}</span>
                    </div>`;
                }).join('')}</div>`;
            } else if (Array.isArray(list)) {
                const builtin = list.map(item => `
                    <li><span class="li-icon">${item.icon}</span> ${item.text}</li>
                `).join('');
                const custom = customItems.map((text, idx) => `
                    <li>
                        <span class="li-icon">📌</span> ${text}
                        <button class="del-btn" data-custom-idx="${idx}" data-custom-key="${customKey}">✕</button>
                    </li>
                `).join('');
                itemsHtml = `<ul>${builtin}${custom}</ul>`;
                itemsHtml += `
                    <div class="add-item">
                        <input type="text" placeholder="输入自定义内容，点击添加..." id="customInput_${tabKey}" />
                        <button class="btn-sm primary" data-custom-key="${customKey}" data-tab="${tabKey}">添加</button>
                    </div>
                `;
            } else {
                itemsHtml = '<div class="text-muted">暂无内容</div>';
            }

            const titleMap = {
                checks: '🩺 检查项目',
                notes: '💡 注意事项',
                diet: '🥗 饮食建议',
                social: '📋 社保与登记',
                fetus: '👶 胎儿发育',
                plan: '📅 产检计划'
            };
            panel.innerHTML = `
                <div class="panel active" data-panel="${tabKey}">
                    <h4>${titleMap[tabKey] || ''}</h4>
                    ${itemsHtml}
                </div>
            `;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabKey));

            // 计划点击
            if (tabKey === 'plan') {
                document.querySelectorAll('.plan-item').forEach(el => {
                    el.addEventListener('click', function() {
                        const key = this.dataset.planKey;
                        if (!key) return;
                        const status = getStorage(STORAGE.planStatus, {});
                        const current = status[key] || 'upcoming';
                        status[key] = current === 'done' ? 'upcoming' : 'done';
                        setStorage(STORAGE.planStatus, status);
                        const activeStage = document.querySelector('.stage-btn.active');
                        const activeTab = document.querySelector('.tab-btn.active');
                        if (activeStage && activeTab) renderGuide(activeStage.dataset.stage, activeTab.dataset.tab);
                    });
                });
            }

            // 自定义添加/删除
            document.querySelectorAll('[data-custom-key]').forEach(btn => {
                if (btn.tagName === 'BUTTON' && btn.textContent === '添加') {
                    btn.addEventListener('click', function() {
                        const key = this.dataset.customKey;
                        const tab = this.dataset.tab;
                        const input = document.getElementById(`customInput_${tab}`);
                        if (!input || !input.value.trim()) return;
                        const items = getStorage(key, []);
                        items.push(input.value.trim());
                        setStorage(key, items);
                        input.value = '';
                        const activeStage = document.querySelector('.stage-btn.active');
                        if (activeStage) renderGuide(activeStage.dataset.stage, tab);
                    });
                } else if (btn.classList.contains('del-btn')) {
                    btn.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.customIdx);
                        const key = this.dataset.customKey;
                        const items = getStorage(key, []);
                        items.splice(idx, 1);
                        setStorage(key, items);
                        const activeStage = document.querySelector('.stage-btn.active');
                        const activeTab = document.querySelector('.tab-btn.active');
                        if (activeStage && activeTab) renderGuide(activeStage.dataset.stage, activeTab.dataset.tab);
                    });
                }
            });

            // 支持回车添加
            const inputEl = document.getElementById(`customInput_${tabKey}`);
            if (inputEl) {
                inputEl.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        const addBtn = this.parentElement.querySelector('[data-custom-key]');
                        if (addBtn) addBtn.click();
                    }
                });
            }
        }

        // ================================================================
        //  更新全部UI
        // ================================================================
        function updateAll(lmpDate, save = true) {
            if (!lmpDate || isNaN(lmpDate.getTime())) {
                document.getElementById('calcSummary').classList.add('hidden');
                document.getElementById('extraTrack').classList.add('hidden');
                return;
            }
            const multiples = parseInt(document.getElementById('multiples').value) || 1;
            const data = calculatePregnancy(lmpDate, multiples);
            const summary = document.getElementById('calcSummary');
            summary.classList.remove('hidden');
            document.getElementById('dueDateDisplay').textContent = data.dueDate.toLocaleDateString('zh-CN', { year: 'numeric',
                month: 'long', day: 'numeric' });
            if (data.isFuture) {
                document.getElementById('weeksDisplay').textContent = '0';
                document.getElementById('daysDisplay').textContent = '0 天';
                document.getElementById('trimesterDisplay').textContent = '尚未怀孕';
            } else {
                const weekStr = data.weeks + (data.remDays > 0 ? `+${data.remDays}d` : '');
                document.getElementById('weeksDisplay').textContent = weekStr;
                document.getElementById('daysDisplay').textContent = `${data.daysPregnant} 天`;
                document.getElementById('trimesterDisplay').textContent = data.trimester;
            }
            // 进度条
            const pct = Math.min(100, Math.round((data.weeks / 40) * 100));
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressLabel').textContent = pct + '%';

            // 倒计时 & 胎儿
            const extra = document.getElementById('extraTrack');
            extra.classList.remove('hidden');
            if (data.isFuture) {
                document.getElementById('countdownNumber').innerHTML = `-- <small>天</small>`;
                document.getElementById('fetusBrief').textContent = '请确认末次月经日期';
            } else {
                const remind = parseInt(document.getElementById('remindDays').value) || 0;
                const days = Math.max(0, data.daysToDue - remind);
                document.getElementById('countdownNumber').innerHTML = `${days} <small>天</small>`;
                const desc = getFetusDesc(data.weeks);
                document.getElementById('fetusBrief').textContent = `孕${data.weeks}周 · ${desc}`;
            }

            if (save) {
                const val = document.getElementById('lastPeriod').value;
                if (val) setStorage(STORAGE.lastPeriod, val);
            }

            const stageKey = data.isFuture ? 'early' : data.stageKey;
            const mem = getStorage(STORAGE.stageMemory, null);
            const finalStage = mem || stageKey;
            document.querySelectorAll('.stage-btn').forEach(b => b.classList.toggle('active', b.dataset.stage === finalStage));

            const activeTab = document.querySelector('.tab-btn.active');
            const tabKey = activeTab ? activeTab.dataset.tab : 'checks';
            renderGuide(finalStage, tabKey);
        }

        // ================================================================
        //  初始化 & 事件绑定
        // ================================================================
        document.addEventListener('DOMContentLoaded', function() {
            // 加载存储
            const saved = getStorage(STORAGE.lastPeriod, null);
            if (saved) {
                document.getElementById('lastPeriod').value = saved;
            } else {
                const d = new Date();
                d.setDate(d.getDate() - 280);
                if (d.getFullYear() < 2020) { d.setFullYear(2024);
                    d.setMonth(0);
                    d.setDate(1); }
                const y = d.getFullYear(),
                    m = String(d.getMonth() + 1).padStart(2, '0'),
                    day = String(d.getDate()).padStart(2, '0');
                document.getElementById('lastPeriod').value = `${y}-${m}-${day}`;
                setStorage(STORAGE.lastPeriod, `${y}-${m}-${day}`);
            }

            const mult = getStorage(STORAGE.multiples, 1);
            document.getElementById('multiples').value = mult;
            const remind = getStorage(STORAGE.remindDays, 7);
            document.getElementById('remindDays').value = remind;

            const hosp = getStorage(STORAGE.hospitalData, { name: '', doctor: '', phone: '' });
            document.getElementById('hospitalName').value = hosp.name || '';
            document.getElementById('doctorName').value = hosp.doctor || '';
            document.getElementById('doctorPhone').value = hosp.phone || '';

            // 健康数据渲染
            function renderHealthData(listId, data, icon) {
                const list = document.getElementById(listId);
                if (!list) return;
                if (data.length === 0) { list.innerHTML = '<div class="text-muted">暂无记录</div>'; return; }
                list.innerHTML = data.slice(-5).reverse().map(d =>
                    `<div><span>${icon} ${d.value}</span><span class="text-muted">${d.time}</span></div>`
                ).join('');
            }
            renderHealthData('weightList', getStorage(STORAGE.weightData, []), '⚖️');
            renderHealthData('bpList', getStorage(STORAGE.bpData, []), '💉');
            renderHealthData('kickList', getStorage(STORAGE.kickData, []), '👣');
            renderHealthData('contractionList', getStorage(STORAGE.contractionData, []), '📊');

            const lmp = new Date(document.getElementById('lastPeriod').value);
            if (!isNaN(lmp)) updateAll(lmp, false);

            // 表单提交
            document.getElementById('dueDateForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const val = document.getElementById('lastPeriod').value;
                if (!val) return alert('请选择末次月经日期');
                const d = new Date(val);
                if (isNaN(d)) return alert('日期无效');
                updateAll(d, true);
            });

            // 快捷按钮
            document.querySelectorAll('[data-quick]').forEach(btn => {
                btn.addEventListener('click', function() {
                    let d = new Date();
                    if (this.dataset.quick === 'today') { /* 保持今天 */ } else if (this.dataset.quick ===
                        '280') { d.setDate(d.getDate() - 280); } else if (this.dataset.quick === '270') { d
                        .setDate(d.getDate() - 270); }
                    const y = d.getFullYear(),
                        m = String(d.getMonth() + 1).padStart(2, '0'),
                        day = String(d.getDate()).padStart(2, '0');
                    const str = `${y}-${m}-${day}`;
                    document.getElementById('lastPeriod').value = str;
                    setStorage(STORAGE.lastPeriod, str);
                    updateAll(new Date(str), true);
                });
            });

            // 多胎/提醒变更
            document.getElementById('multiples').addEventListener('change', function() {
                setStorage(STORAGE.multiples, parseInt(this.value));
                const val = document.getElementById('lastPeriod').value;
                if (val) updateAll(new Date(val), false);
            });
            document.getElementById('remindDays').addEventListener('change', function() {
                setStorage(STORAGE.remindDays, parseInt(this.value) || 0);
                const val = document.getElementById('lastPeriod').value;
                if (val) updateAll(new Date(val), false);
            });

            // 阶段记忆
            document.querySelectorAll('.stage-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const stage = this.dataset.stage;
                    setStorage(STORAGE.stageMemory, stage);
                    const activeTab = document.querySelector('.tab-btn.active');
                    const tabKey = activeTab ? activeTab.dataset.tab : 'checks';
                    renderGuide(stage, tabKey);
                    document.querySelectorAll('.stage-btn').forEach(b => b.classList.toggle('active', b
                        .dataset.stage === stage));
                });
            });

            // 标签切换
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const tabKey = this.dataset.tab;
                    const activeStage = document.querySelector('.stage-btn.active');
                    const stageKey = activeStage ? activeStage.dataset.stage : 'early';
                    renderGuide(stageKey, tabKey);
                });
            });

            // 健康记录添加
            function addHealthRecord(inputId, storageKey, listId, label) {
                const addBtn = document.getElementById(listId + 'Add');
                if (addBtn) {
                    addBtn.addEventListener('click', function() {
                        const input = document.getElementById(inputId);
                        const val = input.value.trim();
                        if (!val) return alert('请输入有效值');
                        const data = getStorage(storageKey, []);
                        data.push({ time: new Date().toLocaleString(), value: val });
                        setStorage(storageKey, data);
                        input.value = '';
                        const list = document.getElementById(listId);
                        if (data.length === 0) { list.innerHTML = '<div class="text-muted">暂无记录</div>'; return; }
                        list.innerHTML = data.slice(-5).reverse().map(d =>
                            `<div><span>${label} ${d.value}</span><span class="text-muted">${d.time}</span></div>`
                        ).join('');
                    });
                    // 回车支持
                    const input = document.getElementById(inputId);
                    if (input) {
                        input.addEventListener('keydown', function(e) {
                            if (e.key === 'Enter') {
                                addBtn.click();
                            }
                        });
                    }
                }
            }
            addHealthRecord('weightInput', STORAGE.weightData, 'weightList', '⚖️');
            addHealthRecord('bpInput', STORAGE.bpData, 'bpList', '💉');
            addHealthRecord('kickInput', STORAGE.kickData, 'kickList', '👣');
            addHealthRecord('contractionInput', STORAGE.contractionData, 'contractionList', '📊');

            // 医院保存
            document.getElementById('hospitalSave').addEventListener('click', function() {
                const name = document.getElementById('hospitalName').value.trim();
                const doctor = document.getElementById('doctorName').value.trim();
                const phone = document.getElementById('doctorPhone').value.trim();
                setStorage(STORAGE.hospitalData, { name, doctor, phone });
                alert('已保存医院信息');
            });

            // 导出/导入
            document.getElementById('exportData').addEventListener('click', function() {
                const all = {};
                for (let key in localStorage) {
                    if (localStorage.hasOwnProperty(key)) {
                        all[key] = localStorage.getItem(key);
                    }
                }
                const blob = new Blob([JSON.stringify(all, null, 2)], { type: 'application/json' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'pregnancy_data.json';
                link.click();
                URL.revokeObjectURL(link.href);
            });
            document.getElementById('importData').addEventListener('click', function() {
                document.getElementById('fileInput').click();
            });
            document.getElementById('fileInput').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const data = JSON.parse(ev.target.result);
                        for (let key in data) {
                            localStorage.setItem(key, data[key]);
                        }
                        alert('导入成功，页面即将刷新');
                        location.reload();
                    } catch (err) {
                        alert('文件格式错误');
                    }
                };
                reader.readAsText(file);
            });

            // 键盘快捷键：在日期输入框按回车提交
            document.getElementById('lastPeriod').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    document.getElementById('calcBtn').click();
                }
            });
        });
    </script>

</body>
</html>
